<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WINHOUSE PROJECT MANAGEMENT</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#0D3D22}
.wrap{min-height:100vh;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.box{max-width:520px}.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:18px;margin:0 0 8px}p{opacity:.8;font-size:12px}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="spin"></div><h1>WINHOUSE PROJECT MANAGEMENT</h1><p id="msg">Đang tải hệ thống...</p></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const r=await fetch('https://zolwitqbdrdrglelljke.supabase.co/functions/v1/winhouse',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const extension="(function winhouseProgressExtension(){\n  if (globalThis.__WINHOUSE_PROGRESS_APPROVAL_V1__) return;\n  globalThis.__WINHOUSE_PROGRESS_APPROVAL_V1__ = true;\n\n  function whDateTime(v){\n    if(!v) return '—';\n    try{return new Date(v).toLocaleString('vi-VN')}catch{return String(v)}\n  }\n  function whProposalClass(s){\n    return s==='Approved'?'good':s==='Rejected'?'bad':s==='Pending'?'warn':'';\n  }\n  async function whLoadProgressProposals(){\n    try{\n      const {data:rows,error}=await sb.from('task_progress_proposals').select('*').order('created_at',{ascending:false});\n      if(error) throw error;\n      data.progressProposals=rows||[];\n      return data.progressProposals;\n    }catch(e){\n      console.warn('task_progress_proposals',e?.message||e);\n      data.progressProposals=data.progressProposals||[];\n      return data.progressProposals;\n    }\n  }\n  function whProposalsForTask(taskId){\n    return (data.progressProposals||[]).filter(x=>x.task_id===taskId)\n      .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));\n  }\n  function whHistoryHtml(rows){\n    if(!rows.length) return '<div class=\"small muted\">Chưa có đề xuất tiến độ.</div>';\n    return `<div class=\"table-wrap\"><table class=\"table\"><thead><tr><th>Gửi lúc</th><th>Đề xuất</th><th>Deadline</th><th>Trạng thái</th><th>Phản hồi</th></tr></thead><tbody>${\n      rows.slice(0,8).map(x=>`<tr>\n        <td>${esc(whDateTime(x.created_at))}</td>\n        <td><b>${Number(x.proposed_progress||0)}%</b> · ${esc(x.proposed_status||'')}</td>\n        <td>${x.proposed_deadline?fmtDate(x.proposed_deadline):'<span class=\"muted\">Giữ nguyên</span>'}</td>\n        <td><span class=\"tag ${whProposalClass(x.status)}\">${esc(x.status||'')}</span></td>\n        <td>${esc(x.review_note||'—')}</td>\n      </tr>`).join('')\n    }</tbody></table></div>`;\n  }\n  function whProposalSummary(x){\n    if(!x) return '';\n    return `<div class=\"accounting-banner\" style=\"margin-bottom:12px\">\n      <b>Đề xuất đang chờ duyệt</b><br>\n      Tiến độ: <b>${Number(x.current_progress||0)}% → ${Number(x.proposed_progress||0)}%</b> ·\n      Trạng thái: <b>${esc(x.current_status||'')} → ${esc(x.proposed_status||'')}</b><br>\n      Deadline: <b>${fmtDate(x.current_deadline)} → ${x.proposed_deadline?fmtDate(x.proposed_deadline):'Giữ nguyên'}</b>\n      ${x.employee_note?`<div style=\"margin-top:6px\">Ghi chú: ${esc(x.employee_note)}</div>`:''}\n    </div>`;\n  }\n\n  const whOriginalLoadAll=loadAll;\n  loadAll=async function(){\n    await whOriginalLoadAll();\n    await whLoadProgressProposals();\n  };\n\n  taskCards=function(rows){\n    return rows.length?`<div class=\"tasks-grid\">${rows.map(t=>{\n      const pending=(data.progressProposals||[]).some(x=>x.task_id===t.id&&x.status==='Pending');\n      return `<div class=\"card task-card\" data-task=\"${t.id}\">\n        <div style=\"display:flex;justify-content:space-between;gap:6px\">\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap\">${tag(t.status)}${pending?'<span class=\"tag warn\">Chờ duyệt</span>':''}</div>\n          <span class=\"tag ${taskOverdue(t)?'bad':''}\">${taskOverdue(t)?'Quá hạn':esc(t.priority)}</span>\n        </div>\n        <h3>${esc(t.title)}</h3>\n        <div class=\"task-meta\">${esc(t.task_code)} · ${esc(project(t.project_id)?.project_code||'')} · ${esc(emp(t.assignee_id)?.full_name||'')}</div>\n        <div class=\"progress\" style=\"margin-top:8px\"><i style=\"width:${t.progress}%\"></i></div>\n        <div class=\"task-meta\" style=\"margin-top:5px\">${t.progress}% · Deadline ${fmtDate(t.deadline)}</div>\n      </div>`;\n    }).join('')}</div>`:'<div class=\"empty\">Không có công việc.</div>';\n  };\n\n  const whOriginalRenderDashboard=renderDashboard;\n  renderDashboard=function(){\n    whOriginalRenderDashboard();\n    const n=(data.progressProposals||[]).filter(x=>x.status==='Pending').length;\n    if(!n) return;\n    document.querySelectorAll('.kpi').forEach(k=>{\n      const label=k.querySelector('.t');\n      const value=k.querySelector('.n');\n      if(label&&value&&label.textContent.trim()==='Việc chờ duyệt'){\n        value.textContent=String((Number(value.textContent)||0)+n);\n      }\n    });\n  };\n\n  async function whOpenReviewProposal(req,decision,t){\n    const reject=decision==='Rejected';\n    modal(reject?'Từ chối đề xuất tiến độ':'Duyệt đề xuất tiến độ',`\n      ${whProposalSummary(req)}\n      <div class=\"field\"><label>${reject?'Lý do từ chối':'Ghi chú duyệt (tùy chọn)'}</label>\n        <textarea id=\"prReviewNote\" class=\"input\" rows=\"3\" placeholder=\"${reject?'Nêu rõ nội dung cần nhân viên điều chỉnh':'Ghi chú cho nhân viên'}\"></textarea>\n      </div>\n      <div class=\"hint\">${reject?'Task chính thức sẽ giữ nguyên.':'Khi duyệt, tiến độ/trạng thái/deadline được đề xuất sẽ cập nhật lên Task chính thức.'}</div>\n    `,reject?'Từ chối':'Duyệt & cập nhật',()=>runAction(async()=>{\n      const note=$('#prReviewNote').value.trim();\n      if(reject&&!note) throw new Error('Cần nhập lý do từ chối.');\n      const {error}=await sb.rpc('review_task_progress_proposal',{\n        p_proposal_id:req.id,\n        p_decision:decision,\n        p_review_note:note||null\n      });\n      if(error) throw error;\n    }));\n  }\n\n  async function whOpenManagerProgressUpdate(t){\n    modal('Quản lý cập nhật tiến độ trực tiếp',`\n      <div class=\"form-grid\">\n        <div class=\"span2\"><label>${esc(t.task_code)} — ${esc(t.title)}</label>\n          <div class=\"small muted\">${esc(emp(t.assignee_id)?.full_name||'')} · ${esc(project(t.project_id)?.project_name||'')}</div>\n        </div>\n        <div><label>Tiến độ chính thức %</label><input id=\"muProg\" type=\"number\" min=\"0\" max=\"100\" class=\"input\" value=\"${Number(t.progress||0)}\"></div>\n        <div><label>Trạng thái</label><select id=\"muStatus\" class=\"input\">${['Chưa bắt đầu','Đang thực hiện','Chờ phản hồi','Tạm dừng','Hoàn thành'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>\n        <div><label>Deadline</label><input id=\"muDeadline\" type=\"date\" class=\"input\" value=\"${t.deadline||''}\"></div>\n        <div><label>Đang chờ ai/nội dung gì</label><input id=\"muWaiting\" class=\"input\" value=\"${esc(t.waiting_for||'')}\"></div>\n        <div class=\"span2\"><label>Kết quả</label><textarea id=\"muResult\" class=\"input\" rows=\"2\">${esc(t.result||'')}</textarea></div>\n        <div><label>Vướng mắc</label><textarea id=\"muIssue\" class=\"input\" rows=\"2\">${esc(t.issue||'')}</textarea></div>\n        <div><label>Cần hỗ trợ</label><textarea id=\"muSupport\" class=\"input\" rows=\"2\">${esc(t.support_needed||'')}</textarea></div>\n        <div class=\"span2\"><label>Kế hoạch tiếp theo</label><textarea id=\"muPlan\" class=\"input\" rows=\"2\">${esc(t.next_plan||'')}</textarea></div>\n        <div class=\"span2\"><label>Link hồ sơ</label><input id=\"muFile\" class=\"input\" value=\"${esc(t.file_url||'')}\"></div>\n        <div class=\"span2\"><label>Ghi chú của quản lý</label><textarea id=\"muNote\" class=\"input\" rows=\"2\"></textarea></div>\n      </div>\n      <div class=\"hint\">Cập nhật trực tiếp của quản lý là số liệu chính thức. Nếu đang có đề xuất Pending, đề xuất đó sẽ tự đóng để tránh duyệt nhầm dữ liệu cũ.</div>\n    `,'Cập nhật chính thức',()=>runAction(async()=>{\n      const {error}=await sb.rpc('official_manager_update_task_progress',{\n        p_task_id:t.id,\n        p_progress:Number($('#muProg').value||0),\n        p_status:$('#muStatus').value,\n        p_deadline:$('#muDeadline').value||null,\n        p_result:$('#muResult').value||null,\n        p_issue:$('#muIssue').value||null,\n        p_support_needed:$('#muSupport').value||null,\n        p_next_plan:$('#muPlan').value||null,\n        p_file_url:$('#muFile').value||null,\n        p_waiting_for:$('#muWaiting').value||null,\n        p_waiting_sent_at:$('#muStatus').value==='Chờ phản hồi'?today():null,\n        p_manager_note:$('#muNote').value||null\n      });\n      if(error) throw error;\n    }));\n  }\n\n  openTask=async function(id){\n    let t=data.tasks.find(x=>x.id===id);\n    if(!t) return;\n\n    await whLoadProgressProposals();\n    const proposals=whProposalsForTask(t.id);\n    const pending=proposals.find(x=>x.status==='Pending');\n    const own=t.assignee_id===currentEmployeeId();\n    const canPlan=canPlanTaskUI(t);\n\n    if(own){\n      if(pending){\n        modal('Đề xuất tiến độ đang chờ duyệt',`\n          <div class=\"form-grid\">\n            <div class=\"span2\"><label>${esc(t.task_code)} — ${esc(t.title)}</label>\n              <div class=\"small muted\">${esc(project(t.project_id)?.project_name||'')}</div>\n            </div>\n          </div>\n          ${whProposalSummary(pending)}\n          <div class=\"report-box\"><h3 style=\"margin-top:0\">Nội dung đã gửi</h3>\n            <div class=\"metric\"><span>Kết quả</span><b>${esc(pending.result||'—')}</b></div>\n            <div class=\"metric\"><span>Vướng mắc</span><b>${esc(pending.issue||'—')}</b></div>\n            <div class=\"metric\"><span>Cần hỗ trợ</span><b>${esc(pending.support_needed||'—')}</b></div>\n            <div class=\"metric\"><span>Kế hoạch tiếp</span><b>${esc(pending.next_plan||'—')}</b></div>\n          </div>\n          <div class=\"toolbar\" style=\"margin-top:12px\">\n            <button id=\"cancelProgressProposal\" class=\"btn btn-danger\">Hủy đề xuất</button>\n            ${canPlan?'<button id=\"editTaskPlan\" class=\"btn btn-soft\">Chỉnh kế hoạch / giờ</button>':''}\n          </div>\n          <div style=\"height:12px\"></div>\n          <div class=\"head\"><h3 style=\"margin:0\">Lịch sử đề xuất</h3></div>\n          ${whHistoryHtml(proposals)}\n        `,null,null);\n        $('#cancelProgressProposal').onclick=()=>runAction(async()=>{\n          const {error}=await sb.rpc('cancel_task_progress_proposal',{p_proposal_id:pending.id});\n          if(error) throw error;\n        });\n        if(canPlan&&$('#editTaskPlan')) $('#editTaskPlan').onclick=()=>openEditTaskPlan(t);\n        return;\n      }\n\n      modal('Báo cáo & đề xuất tiến độ',`\n        <div class=\"form-grid\">\n          <div class=\"span2\"><label>${esc(t.task_code)} — ${esc(t.title)}</label>\n            <div class=\"small muted\">${esc(project(t.project_id)?.project_name||'')} · Người giao: ${esc(emp(t.assigner_id)?.full_name||'—')}</div>\n          </div>\n          <div><label>Tiến độ chính thức hiện tại</label><input class=\"input\" value=\"${Number(t.progress||0)}%\" disabled></div>\n          <div><label>Tiến độ đề xuất %</label><input id=\"ppProg\" type=\"number\" min=\"${Number(t.progress||0)}\" max=\"100\" class=\"input\" value=\"${Number(t.progress||0)}\"></div>\n          <div><label>Trạng thái hiện tại</label><input class=\"input\" value=\"${esc(t.status||'')}\" disabled></div>\n          <div><label>Trạng thái đề xuất</label><select id=\"ppStatus\" class=\"input\">${['Chưa bắt đầu','Đang thực hiện','Chờ phản hồi','Tạm dừng','Hoàn thành'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>\n          <div><label>Deadline chính thức</label><input class=\"input\" value=\"${t.deadline||''}\" disabled></div>\n          <div><label>Đề xuất deadline mới</label><input id=\"ppDeadline\" type=\"date\" class=\"input\"><div class=\"small muted\">Để trống nếu giữ nguyên.</div></div>\n          <div class=\"span2\"><label>Kết quả đạt được</label><textarea id=\"ppResult\" class=\"input\" rows=\"3\">${esc(t.result||'')}</textarea></div>\n          <div><label>Vướng mắc</label><textarea id=\"ppIssue\" class=\"input\" rows=\"3\">${esc(t.issue||'')}</textarea></div>\n          <div><label>Cần hỗ trợ</label><textarea id=\"ppSupport\" class=\"input\" rows=\"3\">${esc(t.support_needed||'')}</textarea></div>\n          <div class=\"span2\"><label>Kế hoạch tiếp theo</label><textarea id=\"ppPlan\" class=\"input\" rows=\"3\">${esc(t.next_plan||'')}</textarea></div>\n          <div class=\"span2\"><label>Link hồ sơ / sản phẩm</label><input id=\"ppFile\" class=\"input\" value=\"${esc(t.file_url||'')}\"></div>\n          <div class=\"span2\"><label>Đang chờ ai/nội dung gì</label><input id=\"ppWaiting\" class=\"input\" value=\"${esc(t.waiting_for||'')}\"></div>\n          <div class=\"span2\"><label>Ghi chú gửi quản lý</label><textarea id=\"ppNote\" class=\"input\" rows=\"2\"></textarea></div>\n        </div>\n        <div class=\"hint\"><b>Quy trình:</b> gửi đề xuất → quản lý duyệt/từ chối → chỉ khi được duyệt số liệu mới cập nhật vào Task chính thức.</div>\n        ${canPlan?'<div class=\"toolbar\" style=\"margin-top:10px\"><button id=\"editTaskPlan\" class=\"btn btn-soft\">Chỉnh kế hoạch / giờ</button></div>':''}\n        ${proposals.length?`<div style=\"height:12px\"></div><div class=\"head\"><h3 style=\"margin:0\">Lịch sử đề xuất</h3></div>${whHistoryHtml(proposals)}`:''}\n      `,'Gửi đề xuất tiến độ',()=>runAction(async()=>{\n        const {error}=await sb.rpc('submit_task_progress_proposal',{\n          p_task_id:t.id,\n          p_progress:Number($('#ppProg').value||0),\n          p_status:$('#ppStatus').value,\n          p_proposed_deadline:$('#ppDeadline').value||null,\n          p_result:$('#ppResult').value||null,\n          p_issue:$('#ppIssue').value||null,\n          p_support_needed:$('#ppSupport').value||null,\n          p_next_plan:$('#ppPlan').value||null,\n          p_file_url:$('#ppFile').value||null,\n          p_waiting_for:$('#ppWaiting').value||null,\n          p_waiting_sent_at:$('#ppStatus').value==='Chờ phản hồi'?today():null,\n          p_employee_note:$('#ppNote').value||null\n        });\n        if(error) throw error;\n      }));\n      if(canPlan&&$('#editTaskPlan')) $('#editTaskPlan').onclick=()=>openEditTaskPlan(t);\n      return;\n    }\n\n    modal('Chi tiết công việc & duyệt tiến độ',`\n      <div class=\"form-grid\">\n        <div class=\"span2\"><label>${esc(t.task_code)} — ${esc(t.title)}</label>\n          <div class=\"small muted\">${esc(project(t.project_id)?.project_name||'')} · ${esc(emp(t.assignee_id)?.full_name||'')}</div>\n        </div>\n        <div><label>Tiến độ chính thức</label><input class=\"input\" value=\"${Number(t.progress||0)}%\" disabled></div>\n        <div><label>Trạng thái</label><input class=\"input\" value=\"${esc(t.status||'')}\" disabled></div>\n        <div><label>Deadline</label><input class=\"input\" value=\"${t.deadline||''}\" disabled></div>\n        <div><label>Giờ dự kiến</label><input class=\"input\" value=\"${Number(t.estimated_hours||0)||'Chưa nhập'}\" disabled></div>\n        <div><label>Người kiểm tra</label><input class=\"input\" value=\"${esc(emp(t.reviewer_id)?.full_name||'Chưa gán')}\" disabled></div>\n        <div><label>Ưu tiên</label><input class=\"input\" value=\"${esc(t.priority||'')}\" disabled></div>\n      </div>\n      ${pending?whProposalSummary(pending):'<div class=\"hint\" style=\"margin-top:12px\">Không có đề xuất tiến độ nào đang chờ duyệt.</div>'}\n      ${pending?`<div class=\"report-box\">\n        <h3 style=\"margin-top:0\">Nội dung nhân viên báo cáo</h3>\n        <div class=\"metric\"><span>Kết quả</span><b>${esc(pending.result||'—')}</b></div>\n        <div class=\"metric\"><span>Vướng mắc</span><b>${esc(pending.issue||'—')}</b></div>\n        <div class=\"metric\"><span>Cần hỗ trợ</span><b>${esc(pending.support_needed||'—')}</b></div>\n        <div class=\"metric\"><span>Kế hoạch tiếp</span><b>${esc(pending.next_plan||'—')}</b></div>\n        <div class=\"metric\"><span>Link hồ sơ</span><b>${pending.file_url?`<a href=\"${esc(safeUrl(pending.file_url))}\" target=\"_blank\" rel=\"noopener noreferrer\">Mở</a>`:'—'}</b></div>\n      </div>`:''}\n      <div class=\"toolbar\" style=\"margin-top:12px\">\n        ${pending&&canPlan?'<button id=\"approveProgress\" class=\"btn btn-good\">Duyệt & cập nhật</button><button id=\"rejectProgress\" class=\"btn btn-danger\">Từ chối</button>':''}\n        ${canPlan?'<button id=\"managerProgress\" class=\"btn btn-primary\">Cập nhật trực tiếp</button><button id=\"editTaskPlan\" class=\"btn btn-soft\">Chỉnh kế hoạch / giờ</button>':''}\n      </div>\n      <div style=\"height:12px\"></div>\n      <div class=\"head\"><h3 style=\"margin:0\">Lịch sử đề xuất</h3></div>\n      ${whHistoryHtml(proposals)}\n    `,null,null);\n\n    if(pending&&canPlan){\n      $('#approveProgress').onclick=()=>whOpenReviewProposal(pending,'Approved',t);\n      $('#rejectProgress').onclick=()=>whOpenReviewProposal(pending,'Rejected',t);\n    }\n    if(canPlan){\n      $('#managerProgress').onclick=()=>whOpenManagerProgressUpdate(t);\n      $('#editTaskPlan').onclick=()=>openEditTaskPlan(t);\n    }\n  };\n\n  setTimeout(async()=>{\n    await whLoadProgressProposals();\n    try{\n      if(typeof view!=='undefined'&&view==='tasks') renderTasks();\n      else if(typeof view!=='undefined'&&view==='dashboard') renderDashboard();\n    }catch(e){console.warn('progress extension initial render',e)}\n  },400);\n})();";
    const injected='<script>'+extension+'<'+'/script>';
    html=html.replace('</body>',injected+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    msg.textContent='Không tải được hệ thống. Vui lòng tải lại trang hoặc liên hệ quản trị WINHOUSE.';
    console.error(e);
  }
})();
</script>
</body>
</html>
