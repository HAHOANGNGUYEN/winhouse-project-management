<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WINHOUSE PROJECT MANAGEMENT</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#0D3D22}
.wrap{min-height:100vh;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.box{max-width:520px}.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:18px;margin:0 0 8px}p{opacity:.8;font-size:12px}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="spin"></div><h1>WINHOUSE PROJECT MANAGEMENT</h1><p id="msg">Đang tải hệ thống...</p></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const r=await fetch('https://zolwitqbdrdrglelljke.supabase.co/functions/v1/winhouse',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch="(function winhouseUiPatchV2(){\n  if (globalThis.__WINHOUSE_UI_PATCH_V2__) return;\n  globalThis.__WINHOUSE_UI_PATCH_V2__ = true;\n\n  if(!document.getElementById('whUiPatchV2Style')){\n    const s=document.createElement('style');\n    s.id='whUiPatchV2Style';\n    s.textContent=`\n      .wh-project-table{width:100%;table-layout:fixed;font-size:12px}\n      .wh-project-table th,.wh-project-table td{padding:8px 6px;vertical-align:top;white-space:normal;overflow-wrap:anywhere}\n      .wh-project-table .wh-project-name{font-weight:700;line-height:1.25}\n      .wh-project-table .wh-people{line-height:1.25}\n      .wh-project-table .wh-progress-cell{display:flex;align-items:center;gap:6px}\n      .wh-project-table .wh-progress-cell .progress{width:70px;min-width:52px}\n      .wh-project-table .wh-file-btn{padding:6px 8px;white-space:nowrap}\n      .wh-team-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}\n      .wh-team-tab{border:1px solid rgba(18,78,45,.15);background:#f3f6f4;color:#173c2a;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}\n      .wh-team-tab.active{background:#176b3a;color:#fff;border-color:#176b3a}\n      .wh-team-tab .wh-count{opacity:.75;font-weight:600;margin-left:5px}\n      .wh-team-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 10px}\n      .wh-team-heading h3{margin:0}\n      @media(max-width:1180px){\n        .wh-project-table{font-size:11px}\n        .wh-project-table th,.wh-project-table td{padding:7px 4px}\n        .wh-project-table .wh-progress-cell .progress{width:56px}\n      }\n    `;\n    document.head.appendChild(s);\n  }\n\n  function whProjectMembers(p){\n    const rows=(data.members||[]).filter(m=>m.project_id===p.id);\n    const ids=[...new Set(rows.map(m=>m.employee_id).filter(Boolean))];\n    const names=ids.map(id=>emp(id)?.full_name).filter(Boolean);\n    return {count:ids.length,names};\n  }\n\n  function whPeopleHtml(info){\n    if(!info.count) return '<span class=\"muted\">Chưa có</span>';\n    const shown=info.names.slice(0,2);\n    const more=Math.max(0,info.count-shown.length);\n    const title=esc(info.names.join(', '));\n    return `<div class=\"wh-people\" title=\"${title}\">\n      <b>${info.count}</b> <span class=\"small muted\">người</span>\n      <div class=\"small\">${shown.map(x=>esc(x)).join(', ')}${more?` <span class=\"muted\">+${more}</span>`:''}</div>\n    </div>`;\n  }\n\n  projectTable=function(rows){\n    return `<div class=\"table-wrap\" style=\"overflow-x:visible\"><table class=\"table wh-project-table\">\n      <colgroup>\n        <col style=\"width:7%\">\n        <col style=\"width:22%\">\n        <col style=\"width:14%\">\n        <col style=\"width:12%\">\n        <col style=\"width:18%\">\n        <col style=\"width:11%\">\n        <col style=\"width:8%\">\n        <col style=\"width:8%\">\n      </colgroup>\n      <thead><tr>\n        <th>Mã dự án</th>\n        <th>Dự án</th>\n        <th>Địa điểm</th>\n        <th>Project Lead</th>\n        <th>Nhân sự tham gia</th>\n        <th>Tiến độ thực hiện</th>\n        <th>Trạng thái</th>\n        <th>Link hồ sơ</th>\n      </tr></thead>\n      <tbody>${rows.map(p=>{\n        const members=whProjectMembers(p);\n        const progress=Math.max(0,Math.min(100,Number(actualProgress(p.id)||0)));\n        const setup=(isCompanyManager()?projectSetupWarnings(p):[]).filter(x=>x!=='bộ môn');\n        const drive=p.onedrive_url\n          ? `<a class=\"btn btn-soft member-mini wh-file-btn\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"${esc(safeUrl(p.onedrive_url))}\" onclick=\"event.stopPropagation()\">Hồ sơ</a>`\n          : '<span class=\"tag warn\">Chưa gán</span>';\n        return `<tr class=\"clickable\" data-project=\"${p.id}\">\n          <td><b>${esc(p.project_code)}</b></td>\n          <td><div class=\"wh-project-name\">${esc(p.project_name)}</div>${setup.length?`<div class=\"setup-warn\">Thiếu: ${esc(setup.join(', '))}</div>`:''}</td>\n          <td>${esc(p.location||'—')}</td>\n          <td>${esc(emp(p.lead_id)?.full_name||'—')}</td>\n          <td>${whPeopleHtml(members)}</td>\n          <td><div class=\"wh-progress-cell\"><div class=\"progress\"><i style=\"width:${progress}%\"></i></div><b>${progress}%</b></div></td>\n          <td>${tag(p.status)}</td>\n          <td>${drive}</td>\n        </tr>`;\n      }).join('')}</tbody>\n    </table></div>`;\n  };\n\n  function whTaskTeamName(t){\n    const e=emp(t.assignee_id);\n    const n=team(e?.team_id)?.name||'';\n    if(n==='Team Concept') return 'Team Concept';\n    if(n==='Team Nội thất') return 'Team Nội thất';\n    if(n==='Team Triển khai') return 'Team Triển khai';\n    return 'Chưa phân nhóm';\n  }\n\n  renderTasks=function(){\n    setTitle(roleCode()==='NHAN_VIEN'?'Công việc của tôi':'Công việc');\n\n    let rows=(data.tasks||[]).filter(t=>!t.archived_at);\n    if(roleCode()==='NHAN_VIEN') rows=rows.filter(t=>t.assignee_id===currentEmployeeId());\n\n    const primaryTeams=['Team Concept','Team Nội thất','Team Triển khai'];\n    const ungroupedCount=rows.filter(t=>whTaskTeamName(t)==='Chưa phân nhóm').length;\n    const groups=ungroupedCount?[...primaryTeams,'Chưa phân nhóm']:primaryTeams;\n\n    let initial=globalThis.__WH_TASK_TEAM_FILTER__;\n    if(roleCode()==='NHAN_VIEN'){\n      const mine=team(emp(currentEmployeeId())?.team_id)?.name;\n      if(groups.includes(mine)) initial=mine;\n    }\n    if(!groups.includes(initial)) initial=groups.find(g=>rows.some(t=>whTaskTeamName(t)===g))||primaryTeams[0];\n    globalThis.__WH_TASK_TEAM_FILTER__=initial;\n\n    $('#content').innerHTML=`<div class=\"card section\">\n      <div class=\"head\">\n        <div><h2>Danh sách công việc</h2><div class=\"small muted\">Phân nhóm theo team của người được giao việc.</div></div>\n        ${canAssign()?'<button id=\"assignTask\" class=\"btn btn-primary\">+ Giao việc</button>':''}\n      </div>\n      <div id=\"teamTabs\" class=\"wh-team-tabs\"></div>\n      <div class=\"filters\">\n        <input id=\"tSearch\" class=\"input\" placeholder=\"Tìm task\">\n        <select id=\"tStatus\" class=\"input\"><option value=\"\">Tất cả trạng thái</option>${['Chưa bắt đầu','Đang thực hiện','Chờ phản hồi','Tạm dừng','Hoàn thành'].map(s=>`<option>${s}</option>`).join('')}</select>\n        <select id=\"tQuick\" class=\"input\"><option value=\"\">Tất cả</option><option value=\"over\">Quá hạn</option><option value=\"support\">Cần hỗ trợ</option></select>\n      </div>\n      <div id=\"taskRows\"></div>\n    </div>`;\n\n    function drawTabs(){\n      const active=globalThis.__WH_TASK_TEAM_FILTER__;\n      $('#teamTabs').innerHTML=groups.map(g=>{\n        const count=rows.filter(t=>whTaskTeamName(t)===g).length;\n        return `<button class=\"wh-team-tab ${g===active?'active':''}\" data-wh-team=\"${esc(g)}\">${esc(g)}<span class=\"wh-count\">${count}</span></button>`;\n      }).join('');\n      document.querySelectorAll('[data-wh-team]').forEach(b=>b.onclick=()=>{\n        globalThis.__WH_TASK_TEAM_FILTER__=b.dataset.whTeam;\n        drawTabs();\n        draw();\n      });\n    }\n\n    function draw(){\n      const q=($('#tSearch').value||'').toLowerCase();\n      const st=$('#tStatus').value;\n      const qf=$('#tQuick').value;\n      const active=globalThis.__WH_TASK_TEAM_FILTER__;\n\n      let rs=rows.filter(t=>whTaskTeamName(t)===active)\n        .filter(t=>(!q||[t.task_code,t.title,project(t.project_id)?.project_code,emp(t.assignee_id)?.full_name].join(' ').toLowerCase().includes(q))&&(!st||t.status===st));\n\n      if(qf==='over') rs=rs.filter(taskOverdue);\n      if(qf==='support') rs=rs.filter(t=>t.support_needed);\n\n      $('#taskRows').innerHTML=`<div class=\"wh-team-heading\">\n          <h3>${esc(active)}</h3>\n          <span class=\"tag\">${rs.length} công việc</span>\n        </div>${taskCards(rs)}`;\n      bindTaskCards();\n    }\n\n    drawTabs();\n    $('#tSearch').oninput=draw;\n    $('#tStatus').onchange=draw;\n    $('#tQuick').onchange=draw;\n    draw();\n    if($('#assignTask')) $('#assignTask').onclick=()=>openAssignTask();\n  };\n})();\n(function winhouseHrMainPatch(){\n  if (globalThis.__WINHOUSE_HR_MAIN_V1__) return;\n  globalThis.__WINHOUSE_HR_MAIN_V1__ = true;\n\n  if(!document.getElementById('whHrMainStyle')){\n    const s=document.createElement('style');\n    s.id='whHrMainStyle';\n    s.textContent=`\n      .wh-hr-main-table{width:100%;table-layout:fixed;font-size:12px}\n      .wh-hr-main-table th,.wh-hr-main-table td{padding:9px 7px;vertical-align:top;white-space:normal;overflow-wrap:anywhere}\n      .wh-hr-main-table .wh-job-list{line-height:1.3}\n      .wh-hr-main-table .wh-job-list .small{margin-top:3px}\n      .wh-hr-main-table .wh-overdue-zero{color:var(--muted,#758079)}\n      .wh-hr-main-table .wh-profile-btn{white-space:nowrap;padding:6px 10px}\n      @media(max-width:1180px){\n        .wh-hr-main-table{font-size:11px}\n        .wh-hr-main-table th,.wh-hr-main-table td{padding:7px 5px}\n      }\n    `;\n    document.head.appendChild(s);\n  }\n\n  function whOpenTasksForEmployee(eid){\n    return (data.tasks||[])\n      .filter(t=>t.assignee_id===eid&&!t.archived_at&&t.status!=='Hoàn thành')\n      .sort((a,b)=>{\n        const ao=taskOverdue(a)?1:0,bo=taskOverdue(b)?1:0;\n        if(ao!==bo)return bo-ao;\n        return String(a.deadline||'9999-12-31').localeCompare(String(b.deadline||'9999-12-31'));\n      });\n  }\n\n  function whTaskSummary(tasks){\n    if(!tasks.length)return '<span class=\"muted\">Không có</span>';\n    const shown=tasks.slice(0,2);\n    const more=Math.max(0,tasks.length-shown.length);\n    const title=tasks.map(t=>`${t.task_code||''} — ${t.title||''}`).join(' | ');\n    return `<div class=\"wh-job-list\" title=\"${esc(title)}\">\n      <b>${tasks.length} công việc</b>\n      ${shown.map(t=>`<div class=\"small\">${esc(t.task_code||'')} · ${esc(t.title||'')}</div>`).join('')}\n      ${more?`<div class=\"small muted\">+${more} công việc khác</div>`:''}\n    </div>`;\n  }\n\n  renderHRDashboard=function(){\n    const es=visibleActiveEmployees();\n    const body=$('#hrBody');\n\n    if(roleCode()==='NHAN_VIEN'){\n      body.innerHTML=employeeProfileHTML(currentEmployeeId());\n      bindEmployeeProfileButtons();\n      return;\n    }\n\n    body.innerHTML=`\n      <div class=\"head\" style=\"margin-bottom:10px\">\n        <div>\n          <h2 style=\"margin:0\">Danh sách nhân sự</h2>\n          <div class=\"small muted\">Theo dõi nhân sự, team và công việc đang đảm nhận.</div>\n        </div>\n        <span class=\"tag\">${es.length} nhân sự</span>\n      </div>\n      <div class=\"filters\" style=\"margin-bottom:10px\">\n        <input id=\"whHrSearch\" class=\"input\" placeholder=\"Tìm mã / tên / chức vụ\">\n        <select id=\"whHrTeam\" class=\"input\">\n          <option value=\"\">Tất cả team</option>\n          ${(data.teams||[]).map(t=>`<option value=\"${t.id}\">${esc(t.name)}</option>`).join('')}\n        </select>\n      </div>\n      <div id=\"whHrRows\"></div>`;\n\n    function draw(){\n      const q=($('#whHrSearch').value||'').trim().toLowerCase();\n      const tid=$('#whHrTeam').value;\n      const rows=es.filter(e=>{\n        const hay=[e.employee_code,e.full_name,e.title,team(e.team_id)?.name].join(' ').toLowerCase();\n        return (!q||hay.includes(q))&&(!tid||e.team_id===tid);\n      });\n\n      $('#whHrRows').innerHTML=`<div class=\"table-wrap\" style=\"overflow-x:visible\">\n        <table class=\"table wh-hr-main-table\">\n          <colgroup>\n            <col style=\"width:22%\">\n            <col style=\"width:16%\">\n            <col style=\"width:14%\">\n            <col style=\"width:30%\">\n            <col style=\"width:10%\">\n            <col style=\"width:8%\">\n          </colgroup>\n          <thead><tr>\n            <th>Nhân sự</th>\n            <th>Chức vụ</th>\n            <th>Team</th>\n            <th>Công việc đảm nhận</th>\n            <th>Công việc quá hạn</th>\n            <th>Hồ sơ</th>\n          </tr></thead>\n          <tbody>${rows.map(e=>{\n            const tasks=whOpenTasksForEmployee(e.id);\n            const overdue=tasks.filter(taskOverdue);\n            return `<tr>\n              <td><b>${esc(e.full_name)}</b><div class=\"small muted\">${esc(e.employee_code||'')}</div></td>\n              <td>${esc(e.title||'—')}</td>\n              <td>${esc(team(e.team_id)?.name||dept(e.department_id)?.name||'—')}</td>\n              <td>${whTaskSummary(tasks)}</td>\n              <td>${overdue.length?`<span class=\"tag bad\">${overdue.length} quá hạn</span>`:'<span class=\"wh-overdue-zero\">0</span>'}</td>\n              <td><button class=\"btn btn-soft wh-profile-btn\" data-hrprofile=\"${e.id}\">Hồ sơ</button></td>\n            </tr>`;\n          }).join('')||'<tr><td colspan=\"6\"><div class=\"empty\">Không có nhân sự phù hợp.</div></td></tr>'}\n          </tbody>\n        </table>\n      </div>`;\n\n      document.querySelectorAll('[data-hrprofile]').forEach(b=>b.onclick=()=>openEmployee360(b.dataset.hrprofile));\n    }\n\n    $('#whHrSearch').oninput=draw;\n    $('#whHrTeam').onchange=draw;\n    draw();\n  };\n})();\n(function winhouseTaskPeriodPatch(){\n  if (globalThis.__WINHOUSE_TASK_PERIOD_V1__) return;\n  globalThis.__WINHOUSE_TASK_PERIOD_V1__ = true;\n\n  if(!document.getElementById('whTaskPeriodStyle')){\n    const s=document.createElement('style');\n    s.id='whTaskPeriodStyle';\n    s.textContent=`\n      .wh-period-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}\n      .wh-period-tabs{display:flex;gap:7px;flex-wrap:wrap}\n      .wh-period-tab{border:1px solid rgba(18,78,45,.15);background:#f3f6f4;color:#173c2a;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}\n      .wh-period-tab.active{background:#176b3a;color:#fff;border-color:#176b3a}\n      .wh-period-nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap}\n      .wh-period-label{font-weight:800;min-width:175px;text-align:center}\n      .wh-task-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 12px}\n      .wh-task-kpi{border:1px solid rgba(18,78,45,.10);border-radius:12px;padding:10px 12px;background:#fafcfb}\n      .wh-task-kpi .l{font-size:11px;color:#6c7771}\n      .wh-task-kpi .v{font-size:21px;font-weight:800;margin-top:2px}\n      .wh-team-tabs{margin-top:4px}\n      .wh-period-note{font-size:11px;color:#6c7771;margin-top:3px}\n      @media(max-width:900px){\n        .wh-task-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}\n        .wh-period-label{min-width:auto}\n      }\n    `;\n    document.head.appendChild(s);\n  }\n\n  function whIso(d){\n    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');\n    return `${y}-${m}-${day}`;\n  }\n  function whDate(s){\n    if(!s)return null;\n    const p=String(s).slice(0,10).split('-').map(Number);\n    if(p.length!==3||!p[0])return null;\n    return new Date(p[0],p[1]-1,p[2],12,0,0,0);\n  }\n  function whFmtShort(d){\n    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;\n  }\n  function whPeriodRange(mode,offset){\n    const now=new Date(),y=now.getFullYear(),m=now.getMonth();\n    let a,b,label;\n    if(mode==='week'){\n      const d=new Date(y,m,now.getDate(),12),dow=d.getDay()||7;\n      a=new Date(d);a.setDate(d.getDate()-dow+1+offset*7);\n      b=new Date(a);b.setDate(a.getDate()+6);\n      label=`${whFmtShort(a)} – ${whFmtShort(b)}`;\n    }else if(mode==='month'){\n      a=new Date(y,m+offset,1,12);\n      b=new Date(a.getFullYear(),a.getMonth()+1,0,12);\n      label=`Tháng ${String(a.getMonth()+1).padStart(2,'0')}/${a.getFullYear()}`;\n    }else if(mode==='quarter'){\n      const currentQ=Math.floor(m/3);\n      const qIndex=currentQ+offset;\n      a=new Date(y, qIndex*3, 1,12);\n      b=new Date(a.getFullYear(),a.getMonth()+3,0,12);\n      label=`Quý ${['I','II','III','IV'][Math.floor(a.getMonth()/3)]}/${a.getFullYear()}`;\n    }else{\n      a=new Date(y+offset,0,1,12);\n      b=new Date(y+offset,11,31,12);\n      label=`Năm ${a.getFullYear()}`;\n    }\n    return {start:whIso(a),end:whIso(b),label};\n  }\n  function whTaskInterval(t){\n    const created=String(t.created_at||'').slice(0,10)||null;\n    let start=t.start_date||created||t.deadline||String(t.completed_at||'').slice(0,10)||null;\n    const ends=[t.deadline,String(t.completed_at||'').slice(0,10),start].filter(Boolean).sort();\n    let end=ends.length?ends[ends.length-1]:start;\n    if(start&&end&&start>end){const x=start;start=end;end=x}\n    return {start,end};\n  }\n  function whInPeriod(t,range){\n    const x=whTaskInterval(t);\n    if(!x.start&&!x.end)return false;\n    const s=x.start||x.end,e=x.end||x.start;\n    return s<=range.end&&e>=range.start;\n  }\n  function whTaskTeamName(t){\n    const e=emp(t.assignee_id);\n    const n=team(e?.team_id)?.name||'';\n    if(n==='Team Concept')return 'Team Concept';\n    if(n==='Team Nội thất')return 'Team Nội thất';\n    if(n==='Team Triển khai')return 'Team Triển khai';\n    return 'Chưa phân nhóm';\n  }\n  function whVisibleTaskBase(){\n    let rows=(data.tasks||[]).filter(t=>!t.archived_at);\n    if(roleCode()==='NHAN_VIEN')rows=rows.filter(t=>t.assignee_id===currentEmployeeId());\n    return rows;\n  }\n\n  renderTasks=function(){\n    setTitle(roleCode()==='NHAN_VIEN'?'Công việc của tôi':'Quản lý công việc');\n\n    const allRows=whVisibleTaskBase();\n    const modes=[\n      ['week','Tuần'],\n      ['month','Tháng'],\n      ['quarter','Quý'],\n      ['year','Năm']\n    ];\n    let mode=globalThis.__WH_TASK_PERIOD_MODE__||'week';\n    if(!modes.some(x=>x[0]===mode))mode='week';\n    let offset=Number(globalThis.__WH_TASK_PERIOD_OFFSET__||0);\n    globalThis.__WH_TASK_PERIOD_MODE__=mode;\n    globalThis.__WH_TASK_PERIOD_OFFSET__=offset;\n\n    $('#content').innerHTML=`<div class=\"card section\">\n      <div class=\"head\">\n        <div>\n          <h2>Quản lý & tra cứu công việc</h2>\n          <div class=\"small muted\">Tra cứu theo tuần, tháng, quý, năm; kết hợp Team, dự án, trạng thái và từ khóa.</div>\n        </div>\n        ${canAssign()?'<button id=\"assignTask\" class=\"btn btn-primary\">+ Giao việc</button>':''}\n      </div>\n\n      <div class=\"wh-period-bar\">\n        <div id=\"periodTabs\" class=\"wh-period-tabs\"></div>\n        <div class=\"wh-period-nav\">\n          <button id=\"periodPrev\" class=\"btn btn-soft\">← Kỳ trước</button>\n          <button id=\"periodNow\" class=\"btn btn-soft\">Kỳ hiện tại</button>\n          <button id=\"periodNext\" class=\"btn btn-soft\">Kỳ sau →</button>\n          <div id=\"periodLabel\" class=\"wh-period-label\"></div>\n        </div>\n      </div>\n\n      <div id=\"taskPeriodKpis\" class=\"wh-task-kpis\"></div>\n      <div id=\"teamTabs\" class=\"wh-team-tabs\"></div>\n\n      <div class=\"filters\">\n        <input id=\"tSearch\" class=\"input\" placeholder=\"Tìm mã, tên công việc, dự án, nhân sự\">\n        <select id=\"tProject\" class=\"input\">\n          <option value=\"\">Tất cả dự án</option>\n          ${(data.projects||[]).filter(p=>!p.archived_at).map(p=>`<option value=\"${p.id}\">${esc(p.project_code)} — ${esc(p.project_name)}</option>`).join('')}\n        </select>\n        <select id=\"tStatus\" class=\"input\">\n          <option value=\"\">Tất cả trạng thái</option>\n          ${['Chưa bắt đầu','Đang thực hiện','Chờ phản hồi','Tạm dừng','Hoàn thành'].map(s=>`<option>${s}</option>`).join('')}\n        </select>\n        <select id=\"tQuick\" class=\"input\">\n          <option value=\"\">Tất cả</option>\n          <option value=\"over\">Quá hạn</option>\n          <option value=\"support\">Cần hỗ trợ</option>\n          <option value=\"done\">Đã hoàn thành</option>\n        </select>\n      </div>\n      <div class=\"wh-period-note\">Một Task được tính trong kỳ nếu thời gian thực hiện của Task giao nhau với khoảng thời gian đang chọn.</div>\n      <div id=\"taskRows\" style=\"margin-top:10px\"></div>\n    </div>`;\n\n    function currentRange(){\n      return whPeriodRange(globalThis.__WH_TASK_PERIOD_MODE__,Number(globalThis.__WH_TASK_PERIOD_OFFSET__||0));\n    }\n    function periodRows(){\n      const range=currentRange();\n      return allRows.filter(t=>whInPeriod(t,range));\n    }\n    function groupsFor(rows){\n      const primary=['Tất cả','Team Concept','Team Nội thất','Team Triển khai'];\n      if(rows.some(t=>whTaskTeamName(t)==='Chưa phân nhóm'))primary.push('Chưa phân nhóm');\n      return primary;\n    }\n    function ensureTeam(rows){\n      const groups=groupsFor(rows);\n      let active=globalThis.__WH_TASK_TEAM_FILTER__;\n      if(roleCode()==='NHAN_VIEN'){\n        const mine=team(emp(currentEmployeeId())?.team_id)?.name;\n        if(groups.includes(mine))active=mine;\n      }\n      if(!groups.includes(active))active=roleCode()==='NHAN_VIEN'\n        ? (groups.find(g=>g!=='Tất cả'&&rows.some(t=>whTaskTeamName(t)===g))||'Tất cả')\n        : 'Tất cả';\n      globalThis.__WH_TASK_TEAM_FILTER__=active;\n      return groups;\n    }\n    function drawPeriodTabs(){\n      const active=globalThis.__WH_TASK_PERIOD_MODE__;\n      $('#periodTabs').innerHTML=modes.map(([k,l])=>`<button class=\"wh-period-tab ${k===active?'active':''}\" data-wh-period=\"${k}\">${l}</button>`).join('');\n      document.querySelectorAll('[data-wh-period]').forEach(b=>b.onclick=()=>{\n        globalThis.__WH_TASK_PERIOD_MODE__=b.dataset.whPeriod;\n        globalThis.__WH_TASK_PERIOD_OFFSET__=0;\n        drawAll();\n      });\n    }\n    function drawNav(){\n      const range=currentRange();\n      $('#periodLabel').textContent=range.label;\n    }\n    function drawKpis(rows){\n      const open=rows.filter(t=>t.status!=='Hoàn thành').length;\n      const overdue=rows.filter(taskOverdue).length;\n      const done=rows.filter(t=>t.status==='Hoàn thành').length;\n      $('#taskPeriodKpis').innerHTML=`\n        <div class=\"wh-task-kpi\"><div class=\"l\">Tổng công việc trong kỳ</div><div class=\"v\">${rows.length}</div></div>\n        <div class=\"wh-task-kpi\"><div class=\"l\">Đang mở</div><div class=\"v\">${open}</div></div>\n        <div class=\"wh-task-kpi\"><div class=\"l\">Quá hạn</div><div class=\"v\">${overdue}</div></div>\n        <div class=\"wh-task-kpi\"><div class=\"l\">Hoàn thành</div><div class=\"v\">${done}</div></div>`;\n    }\n    function drawTeamTabs(rows){\n      const groups=ensureTeam(rows);\n      const active=globalThis.__WH_TASK_TEAM_FILTER__;\n      $('#teamTabs').innerHTML=groups.map(g=>{\n        const count=g==='Tất cả'?rows.length:rows.filter(t=>whTaskTeamName(t)===g).length;\n        return `<button class=\"wh-team-tab ${g===active?'active':''}\" data-wh-team=\"${esc(g)}\">${esc(g)}<span class=\"wh-count\">${count}</span></button>`;\n      }).join('');\n      document.querySelectorAll('[data-wh-team]').forEach(b=>b.onclick=()=>{\n        globalThis.__WH_TASK_TEAM_FILTER__=b.dataset.whTeam;\n        drawTeamTabs(periodRows());\n        drawList();\n      });\n    }\n    function filteredRows(){\n      let rows=periodRows();\n      const teamFilter=globalThis.__WH_TASK_TEAM_FILTER__;\n      if(teamFilter&&teamFilter!=='Tất cả')rows=rows.filter(t=>whTaskTeamName(t)===teamFilter);\n\n      const q=($('#tSearch').value||'').trim().toLowerCase();\n      const pid=$('#tProject').value;\n      const st=$('#tStatus').value;\n      const qf=$('#tQuick').value;\n\n      rows=rows.filter(t=>{\n        const p=project(t.project_id),e=emp(t.assignee_id);\n        const hay=[t.task_code,t.title,p?.project_code,p?.project_name,e?.employee_code,e?.full_name].join(' ').toLowerCase();\n        return (!q||hay.includes(q))&&(!pid||t.project_id===pid)&&(!st||t.status===st);\n      });\n      if(qf==='over')rows=rows.filter(taskOverdue);\n      if(qf==='support')rows=rows.filter(t=>t.support_needed);\n      if(qf==='done')rows=rows.filter(t=>t.status==='Hoàn thành');\n\n      return rows.sort((a,b)=>{\n        const ao=taskOverdue(a)?1:0,bo=taskOverdue(b)?1:0;\n        if(ao!==bo)return bo-ao;\n        return String(a.deadline||'9999-12-31').localeCompare(String(b.deadline||'9999-12-31'));\n      });\n    }\n    function drawList(){\n      const rs=filteredRows();\n      const teamFilter=globalThis.__WH_TASK_TEAM_FILTER__||'Tất cả';\n      $('#taskRows').innerHTML=`<div class=\"wh-team-heading\">\n        <h3>${esc(teamFilter)}</h3>\n        <span class=\"tag\">${rs.length} công việc</span>\n      </div>${taskCards(rs)}`;\n      bindTaskCards();\n    }\n    function drawAll(){\n      drawPeriodTabs();\n      drawNav();\n      const pr=periodRows();\n      drawKpis(pr);\n      drawTeamTabs(pr);\n      drawList();\n    }\n\n    $('#periodPrev').onclick=()=>{\n      globalThis.__WH_TASK_PERIOD_OFFSET__=Number(globalThis.__WH_TASK_PERIOD_OFFSET__||0)-1;\n      drawAll();\n    };\n    $('#periodNext').onclick=()=>{\n      globalThis.__WH_TASK_PERIOD_OFFSET__=Number(globalThis.__WH_TASK_PERIOD_OFFSET__||0)+1;\n      drawAll();\n    };\n    $('#periodNow').onclick=()=>{\n      globalThis.__WH_TASK_PERIOD_OFFSET__=0;\n      drawAll();\n    };\n    $('#tSearch').oninput=drawList;\n    $('#tProject').onchange=drawList;\n    $('#tStatus').onchange=drawList;\n    $('#tQuick').onchange=drawList;\n\n    drawAll();\n    if($('#assignTask'))$('#assignTask').onclick=()=>openAssignTask();\n  };\n})();";
    const closeBody=html.toLowerCase().lastIndexOf('</body>');
    if(closeBody>=0){
      html=html.slice(0,closeBody)+'<script>'+patch+'<'+'/script>'+html.slice(closeBody);
    }
    document.open();document.write(html);document.close();
  }catch(e){
    msg.textContent='Không tải được hệ thống. Vui lòng tải lại trang hoặc liên hệ quản trị WINHOUSE.';
    console.error(e);
  }
})();
</script>
