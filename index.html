<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WINHOUSE PROJECT MANAGEMENT</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#0D3D22}
.wrap{min-height:100vh;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.box{max-width:520px}.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}h1{font-size:18px;margin:0 0 8px}p{opacity:.8;font-size:12px}
</style>
</head>
<body>
<div class="wrap"><div class="box"><div class="spin"></div><h1>WINHOUSE PROJECT MANAGEMENT</h1><p id="msg">Đang tải hệ thống...</p></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    const r=await fetch('https://zolwitqbdrdrglelljke.supabase.co/functions/v1/winhouse',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const patch="(function winhouseProjectTablePatch(){\n  if (globalThis.__WINHOUSE_PROJECT_TABLE_V1__) return;\n  globalThis.__WINHOUSE_PROJECT_TABLE_V1__ = true;\n\n  function whProjectMembers(p){\n    const rows=(data.members||[]).filter(m=>m.project_id===p.id);\n    const ids=[...new Set(rows.map(m=>m.employee_id).filter(Boolean))];\n    const names=ids.map(id=>emp(id)?.full_name).filter(Boolean);\n    return {count:ids.length,names};\n  }\n\n  function whProjectDisciplines(p){\n    const rows=(data.disciplines||[]).filter(d=>d.project_id===p.id&&!d.archived_at);\n    const names=[...new Set(rows.map(d=>d.discipline_name||dept(d.department_id)?.name).filter(Boolean))];\n    return {count:names.length,names};\n  }\n\n  function whCompactNames(info,emptyText){\n    if(!info.count) return `<span class=\"muted\">${emptyText}</span>`;\n    const shown=info.names.slice(0,3);\n    const more=Math.max(0,info.count-shown.length);\n    return `<div><b>${info.count}</b> <span class=\"small muted\">người</span></div>\n      <div class=\"small\">${shown.map(x=>esc(x)).join(', ')}${more?` <span class=\"muted\">+${more}</span>`:''}</div>`;\n  }\n\n  function whCompactDisciplines(info){\n    if(!info.count) return '<span class=\"muted\">Chưa gán</span>';\n    const shown=info.names.slice(0,3);\n    const more=Math.max(0,info.count-shown.length);\n    return `<div><b>${info.count}</b> <span class=\"small muted\">bộ môn</span></div>\n      <div class=\"small\">${shown.map(x=>esc(x)).join(', ')}${more?` <span class=\"muted\">+${more}</span>`:''}</div>`;\n  }\n\n  projectTable=function(rows){\n    return `<div class=\"table-wrap\"><table class=\"table\" style=\"min-width:1280px\">\n      <thead><tr>\n        <th style=\"min-width:90px\">Mã dự án</th>\n        <th style=\"min-width:220px\">Dự án</th>\n        <th style=\"min-width:170px\">Địa điểm</th>\n        <th style=\"min-width:150px\">Project Lead</th>\n        <th style=\"min-width:180px\">Nhân sự tham gia</th>\n        <th style=\"min-width:180px\">Bộ môn phối hợp</th>\n        <th style=\"min-width:145px\">Tiến độ thực hiện</th>\n        <th style=\"min-width:120px\">Trạng thái</th>\n        <th style=\"min-width:110px\">Link hồ sơ</th>\n      </tr></thead>\n      <tbody>${rows.map(p=>{\n        const members=whProjectMembers(p);\n        const disciplines=whProjectDisciplines(p);\n        const progress=Math.max(0,Math.min(100,Number(actualProgress(p.id)||0)));\n        const setup=isCompanyManager()?projectSetupWarnings(p):[];\n        const drive=p.onedrive_url?`<a class=\"btn btn-soft member-mini\" target=\"_blank\" rel=\"noopener noreferrer\" href=\"${esc(safeUrl(p.onedrive_url))}\" onclick=\"event.stopPropagation()\">Mở hồ sơ</a>`:'<span class=\"tag warn\">Chưa gán</span>';\n        return `<tr class=\"clickable\" data-project=\"${p.id}\">\n          <td><b>${esc(p.project_code)}</b></td>\n          <td><b>${esc(p.project_name)}</b>${setup.length?`<div class=\"setup-warn\">Thiếu: ${esc(setup.join(', '))}</div>`:''}</td>\n          <td>${esc(p.location||'—')}</td>\n          <td>${esc(emp(p.lead_id)?.full_name||'—')}</td>\n          <td>${whCompactNames(members,'Chưa có')}</td>\n          <td>${whCompactDisciplines(disciplines)}</td>\n          <td>\n            <div style=\"display:flex;align-items:center;gap:8px;min-width:125px\">\n              <div class=\"progress\" style=\"width:88px\"><i style=\"width:${progress}%\"></i></div>\n              <b>${progress}%</b>\n            </div>\n          </td>\n          <td>${tag(p.status)}</td>\n          <td>${drive}</td>\n        </tr>`;\n      }).join('')}</tbody>\n    </table></div>`;\n  };\n})();";
    const closeBody=html.toLowerCase().lastIndexOf('</body>');
    if(closeBody>=0){
      html=html.slice(0,closeBody)+'<script>'+patch+'<'+'/script>'+html.slice(closeBody);
    }
    document.open();document.write(html);document.close();
  }catch(e){
    msg.textContent='Không tải được hệ thống. Vui lòng tải lại trang hoặc liên hệ quản trị WINHOUSE.';
    console.error(e);
  }
})();
</script>
</body>
</html>
